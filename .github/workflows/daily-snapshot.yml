name: daily snapshot

# Keeps the Whoop widget and the life-os blurb current, once a day.
#
# The pages are prerendered, so the numbers live in data/*.json and reach a visitor in the
# first byte of static HTML. This job is the only thing that changes them: pull the
# precomputed values from the life-os edge API, rebuild, deploy, then commit the new files.
#
# 08:30 UTC, not midnight. Whoop publishes the night's recovery between roughly 06:20 and
# 07:35 UTC, so an earlier run would republish yesterday's score every day.
on:
  schedule:
    - cron: "30 8 * * *"
  # Manual re-run after fixing a secret, or to force today's numbers out.
  workflow_dispatch:

# One publisher at a time: two overlapping runs would race on the same commit.
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The refresh script imports Effect, and `bun` does not resolve node_modules without
      # an install, so this has to come before the fetch as well as before the build.
      - run: bun install --frozen-lockfile

      - name: Fetch the snapshots from life-os
        id: refresh
        env:
          LIFEOS_API_URL: ${{ vars.LIFEOS_API_URL }}
          LIFEOS_WEB_TOKEN: ${{ secrets.LIFEOS_WEB_TOKEN }}
        run: bun scripts/refresh-life-os.ts

      # Deploy before committing. If the deploy fails, nothing is pushed and tomorrow's run
      # retries the same change; the reverse order would leave the repo claiming a number
      # the live site never got.
      - if: steps.refresh.outputs.changed == 'true'
        name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy

      - if: steps.refresh.outputs.changed == 'true'
        name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/whoop/latest.json data/life-os-overview.json
          git commit -m "chore: refresh life-os snapshot"
          git push

      # A green deploy means Cloudflare accepted the upload; it does not mean the HTML a
      # visitor loads carries today's numbers. Two checks, in order of how much they prove:
      # the prerendered artefact (deterministic, local) and the live page (end to end, but
      # Cloudflare challenges datacenter IPs, so a blocked probe must not fail the job —
      # only a page that loads *without* the date is a real failure).
      - if: steps.refresh.outputs.changed == 'true'
        name: Verify the build carries the date
        run: |
          grep -q "name=\"whoop-snapshot\" content=\"${{ steps.refresh.outputs.date }}\"" dist/client/index.html
          echo "prerendered HTML carries the ${{ steps.refresh.outputs.date }} snapshot"

      - if: steps.refresh.outputs.changed == 'true'
        name: Probe the live page
        env:
          DATE: ${{ steps.refresh.outputs.date }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -sS --max-time 20 \
              -A "Mozilla/5.0 (compatible; einargudni-daily-snapshot/1.0)" \
              -w '\n%{http_code}' https://einargudni.com/ || true)
            CODE=$(printf '%s' "$BODY" | tail -n1)
            if [ "$CODE" = "200" ]; then
              if printf '%s' "$BODY" | grep -q "name=\"whoop-snapshot\" content=\"$DATE\""; then
                echo "live page serves the $DATE snapshot"
                exit 0
              fi
              echo "attempt $attempt: the site answered but still shows the previous snapshot"
            else
              echo "attempt $attempt: probe blocked (HTTP ${CODE:-none}) — Cloudflare challenges datacenter IPs; the build check above is authoritative"
              exit 0
            fi
            sleep 10
          done
          echo "the live page answered 200 but never served $DATE" >&2
          exit 1
