name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Catches content and prerender failures: islands outside the vocabulary,
      # dead `related` links, unresolved CHECK notes, any page that doesn't 200.
      - run: bun run build
      # Generates the gitignored worker-configuration.d.ts (cloudflare:workers).
      - run: bun run cf-typegen
      # oxlint + oxfmt --check + velite + tsc
      - run: bun run check
